# Source: Lichtenstein catalogue raisonné scan, 1180x1200 (source/drowning_girl_hires.jpg).
# The old 432px WikiArt copy is source/drowning_girl.jpg; coordinates below are for the hi-res scan.
SRC=source/drowning_girl_hires.jpg
NAME=drowning_girl
# Approximate centre of each eye in the source image (pixels)
EYE1_X=725; EYE1_Y=435
EYE2_X=862; EYE2_Y=500
# Crop rectangle (pixels in the rotated image), centred on the eye midpoint; SHIFT nudges it
CROP_W=440; CROP_H=170
SHIFT_X=-16; SHIFT_Y=-11
TURD=40
# Colour layers: name|svg fill|sampled colour|fuzz|blur   (later entries draw on top)
LAYERS=(
  "hair|#1b2fa0|#2428a0|22%|0|3"
  "lines|#000000|#101010|28%|0"
)
# Skin: everything not claimed by a layer or an exclusion gets dots
SKIN=all
# Tears / eye whites are handled by ENCLOSED_MAX_AREA below; no colour-based exclusion needed
SKIN_EXCLUDE=()
# Measured from the scan: rows 3 px apart, dots 3 px apart, every other row offset by half (brick pattern)
DOT_COLOR="#c0392b"; DOT_SPACING=3; DOT_RADIUS=0.85
DOT_ANGLE_SRC=0; DOT_STAGGER=1; DOT_ROW_SPACING=3
EXCLUDE_GROW=2
ENCLOSED_MAX_AREA=4000
# Drop small black flecks traced inside the blue hair (max 100 px² each)
LAYER_PRUNE=("lines|hair|100")
